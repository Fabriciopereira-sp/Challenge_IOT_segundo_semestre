<svg width="680" height="280" viewBox="0 0 680 280" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Arquitetura do agente de IA do bebedouro inteligente</title>
<desc>Fluxo de dados desde o sensor ESP32, passando pelo broker MQTT, pelo agente de IA que detecta anomalias e gera alertas com Ollama, consultando o histórico no banco de dados, até o dashboard visto pelo tutor.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="280" fill="#FFFFFF"/>

<rect x="40" y="80" width="120" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="100" y="100" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">ESP32</text>
<text x="100" y="118" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Sensores IoT</text>

<line x1="160" y1="108" x2="178" y2="108" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="180" y="80" width="140" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="250" y="100" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Broker MQTT</text>
<text x="250" y="118" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">HiveMQ público</text>

<line x1="320" y1="108" x2="338" y2="108" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="340" y="80" width="160" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="420" y="100" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Agente de IA</text>
<text x="420" y="118" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Anomalia + Ollama</text>

<line x1="500" y1="108" x2="518" y2="108" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="520" y="80" width="120" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="580" y="100" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Dashboard</text>
<text x="580" y="118" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">Alerta tutor</text>

<line x1="420" y1="180" x2="420" y2="138" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="340" y="180" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="420" y="200" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Banco de dados</text>
<text x="420" y="218" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">Histórico consumo</text>
</svg>