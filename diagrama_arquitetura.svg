<svg width="820" height="470" viewBox="0 0 820 470" xmlns="http://www.w3.org/2000/svg" role="img" font-family="sans-serif">
<title>Arquitetura da Sprint 4 - bebedouro inteligente CLYVO VET</title>
<desc>ESP32 publica no broker MQTT. O agente de IA (aplicação em Python) calcula consumo e anomalias, consulta o perfil do pet no banco SQLite, chama o LLM local (Ollama) para ordenar e explicar as causas e grava leituras e alertas no banco. A API FastAPI lê o banco e serve o dashboard do tutor e da clínica. A clínica atualiza o perfil do pet pela API.</desc>
<defs>
<marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#444" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="820" height="470" fill="#FFFFFF"/>
<text x="410" y="26" text-anchor="middle" font-size="16" font-weight="600" fill="#1c2733">Arquitetura - Sprint 4</text>

<!-- ESP32 -->
<rect x="30" y="70" width="130" height="64" rx="8" fill="#F1EFE8" stroke="#555" stroke-width="1"/>
<text x="95" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#222">ESP32</text>
<text x="95" y="116" text-anchor="middle" font-size="12" fill="#444">HC-SR04 + DHT22</text>

<!-- Broker -->
<rect x="200" y="70" width="130" height="64" rx="8" fill="#E6F1FB" stroke="#185FA5" stroke-width="1"/>
<text x="265" y="96" text-anchor="middle" font-size="14" font-weight="600" fill="#0C447C">Broker MQTT</text>
<text x="265" y="116" text-anchor="middle" font-size="12" fill="#185FA5">HiveMQ</text>

<!-- Agente -->
<rect x="370" y="52" width="200" height="100" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="1"/>
<text x="470" y="76" text-anchor="middle" font-size="14" font-weight="600" fill="#3C3489">Aplicação: agente de IA</text>
<text x="470" y="97" text-anchor="middle" font-size="12" fill="#534AB7">consumo a partir do nível</text>
<text x="470" y="115" text-anchor="middle" font-size="12" fill="#534AB7">detecção (mediana + MAD)</text>
<text x="470" y="133" text-anchor="middle" font-size="12" fill="#534AB7">gatilho por tempo</text>

<!-- Ollama -->
<rect x="620" y="62" width="170" height="80" rx="8" fill="#EAF3DE" stroke="#3B6D11" stroke-width="1"/>
<text x="705" y="88" text-anchor="middle" font-size="14" font-weight="600" fill="#27500A">API de IA: Ollama</text>
<text x="705" y="108" text-anchor="middle" font-size="12" fill="#3B6D11">LLM local (llama3.2)</text>
<text x="705" y="126" text-anchor="middle" font-size="12" fill="#3B6D11">ordena e explica causas</text>

<!-- Banco -->
<rect x="370" y="220" width="200" height="76" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="1"/>
<text x="470" y="246" text-anchor="middle" font-size="14" font-weight="600" fill="#633806">Banco de dados SQLite</text>
<text x="470" y="266" text-anchor="middle" font-size="12" fill="#854F0B">pets, consumo, eventos,</text>
<text x="470" y="282" text-anchor="middle" font-size="12" fill="#854F0B">alertas, estado atual</text>

<!-- API -->
<rect x="370" y="364" width="200" height="64" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="1"/>
<text x="470" y="390" text-anchor="middle" font-size="14" font-weight="600" fill="#085041">API REST (FastAPI)</text>
<text x="470" y="410" text-anchor="middle" font-size="12" fill="#0F6E56">9 endpoints, docs em /docs</text>

<!-- Dashboard -->
<rect x="620" y="352" width="170" height="88" rx="8" fill="#FBEAF0" stroke="#993556" stroke-width="1"/>
<text x="705" y="378" text-anchor="middle" font-size="14" font-weight="600" fill="#72243E">Dashboard</text>
<text x="705" y="398" text-anchor="middle" font-size="12" fill="#993556">tela do tutor</text>
<text x="705" y="416" text-anchor="middle" font-size="12" fill="#993556">tela da clínica (perfil do pet)</text>

<!-- Setas -->
<line x1="160" y1="102" x2="198" y2="102" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="330" y1="102" x2="368" y2="102" stroke="#444" stroke-width="1.5" marker-end="url(#a)"/>
<text x="265" y="156" text-anchor="middle" font-size="11" fill="#555">nivel, temp</text>
<line x1="570" y1="102" x2="618" y2="102" stroke="#444" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="594" y="94" text-anchor="middle" font-size="11" fill="#555">prompt</text>
<line x1="470" y1="152" x2="470" y2="218" stroke="#444" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="480" y="190" font-size="11" fill="#555">grava leituras e alertas / lê perfil</text>
<line x1="470" y1="296" x2="470" y2="362" stroke="#444" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="480" y="334" font-size="11" fill="#555">consulta e atualiza</text>
<line x1="570" y1="396" x2="618" y2="396" stroke="#444" stroke-width="1.5" marker-start="url(#a)" marker-end="url(#a)"/>
<text x="594" y="388" text-anchor="middle" font-size="11" fill="#555">HTTP</text>

<!-- Publicação MQTT de volta -->
<path d="M420 52 L420 40 L265 40 L265 68" fill="none" stroke="#444" stroke-width="1.2" stroke-dasharray="4 3" marker-end="url(#a)"/>
<text x="340" y="36" text-anchor="middle" font-size="11" fill="#555">ia_estado, ia_alerta</text>

<!-- Usuários -->
<text x="705" y="460" text-anchor="middle" font-size="12" fill="#555">usuários: tutor e clínica veterinária</text>

<!-- Nota -->
<rect x="30" y="220" width="300" height="130" rx="8" fill="#F7F7F5" stroke="#bbb" stroke-width="1"/>
<text x="42" y="244" font-size="12" font-weight="600" fill="#333">Fluxo da personalização</text>
<text x="42" y="266" font-size="12" fill="#444">1. A clínica altera idade, peso, condições</text>
<text x="42" y="284" font-size="12" fill="#444">    ou medicações pelo dashboard.</text>
<text x="42" y="304" font-size="12" fill="#444">2. A API grava no banco.</text>
<text x="42" y="324" font-size="12" fill="#444">3. A próxima análise do agente já usa o</text>
<text x="42" y="342" font-size="12" fill="#444">    perfil novo no prompt da IA.</text>
</svg>
