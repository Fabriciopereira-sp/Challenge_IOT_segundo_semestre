<svg width="680" height="300" viewBox="0 0 680 300" xmlns="http://www.w3.org/2000/svg" role="img">
<title>Arquitetura corrigida do agente de IA do bebedouro inteligente</title>
<desc>ESP32 envia dados via broker MQTT para a Aplicação (agente), que se comunica com o Banco de dados para consultar o histórico e com a API de IA (Ollama, componente de IA) para gerar mensagens, publicando o resultado no Dashboard do tutor.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="680" height="300" fill="#FFFFFF"/>

<rect x="50" y="80" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="115" y="100" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">ESP32</text>
<text x="115" y="118" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">Sensores IoT</text>

<line x1="180" y1="108" x2="198" y2="108" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="200" y="80" width="130" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.5"/>
<text x="265" y="100" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#2C2C2A">Broker MQTT</text>
<text x="265" y="118" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#444441">HiveMQ público</text>

<line x1="330" y1="108" x2="348" y2="108" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="350" y="80" width="130" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.5"/>
<text x="415" y="100" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#04342C">Aplicação</text>
<text x="415" y="118" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#085041">Agente / lógica</text>

<line x1="480" y1="108" x2="498" y2="108" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="500" y="80" width="130" height="56" rx="8" fill="#FAECE7" stroke="#993C1D" stroke-width="0.5"/>
<text x="565" y="100" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#4A1B0C">Dashboard</text>
<text x="565" y="118" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#712B13">Alerta tutor</text>

<path d="M415,136 L415,165 L310,165 L310,198" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>
<path d="M415,136 L415,165 L505,165 L505,198" fill="none" stroke="#5F5E5A" stroke-width="0.5" marker-end="url(#arrow)"/>

<rect x="230" y="200" width="160" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.5"/>
<text x="310" y="220" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#26215C">Banco de dados</text>
<text x="310" y="238" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#3C3489">Histórico consumo</text>

<rect x="410" y="200" width="190" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.5"/>
<text x="505" y="220" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="14" font-weight="500" fill="#412402">API de IA</text>
<text x="505" y="238" text-anchor="middle" dominant-baseline="central" font-family="sans-serif" font-size="12" fill="#633806">Modelo LLM - Ollama</text>
</svg>